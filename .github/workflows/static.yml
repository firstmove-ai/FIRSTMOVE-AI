name: Deploy website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build website
        run: |
          cd clientzero-ai*
          npm install --legacy-peer-deps
          npm run build -- --base=./
          cp -a dist ../site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

      - name: Wait for artifact
        run: sleep 30

      - uses: actions/deploy-pages@v5
        id: deployment
